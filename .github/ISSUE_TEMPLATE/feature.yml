name: Feature request
description: Propose a storefront, workflow, accessibility, or developer-experience improvement.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Backend or Shopify impact
      description: Note API contracts, scopes, App Proxy, checkout, webhook, or Theme Editor changes.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
