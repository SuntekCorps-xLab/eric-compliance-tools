name: Bug report
description: Report a reproducible storefront problem. Do not report vulnerabilities here.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security issues, stop and follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Shopify homepage App Embed
        - Shopify workspace App Block
        - Local mock preview
        - Build or CI
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Remove customer data, tokens, signatures, store IDs, and private URLs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Browser and validation details
      placeholder: Browser, viewport, console error, and relevant test command
